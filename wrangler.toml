name = "vus-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Проверка напоминаний и истёкших объявлений — каждый час
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vus-db"
database_id = "ВСТАВЬ_СЮДА_ID_БАЗЫ"

[vars]
BOT_USERNAME = "vus_ua_bot"
CHANNEL_USERNAME = "vus_ua"
GROUP_USERNAME = "vus_chat"
CHANNEL_ID = "@vus_ua"
ADMIN_CHAT_ID = "ВСТАВЬ_ID_АДМИНКИ"
OWNER_ID = "ВСТАВЬ_СВОЙ_TELEGRAM_ID"
