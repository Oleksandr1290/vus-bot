name = "vus-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Нічний режим перевіряється кожні 5 хвилин, решта завдань — раз на годину
[triggers]
crons = ["*/5 * * * *"]

# Нейромережа-модератор (Cloudflare Workers AI, безкоштовна квота на день)
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "vus-db"
database_id = "4410d733-2bb6-4469-b370-0dd67ae9f7c9"

[vars]
BOT_USERNAME = "vus_ua_bot"
CHANNEL_USERNAME = "vus_ogoloshennya_ua"
GROUP_USERNAME = "vus_chat"
CHANNEL_ID = "-1004410791584"
ADMIN_CHAT_ID = "-1004302081989"
GROUP_ID = "-1004411759008"
OWNER_ID = "1463957271"
# Закритий канал «ВУС | Ідеї». Поки рядок закоментовано, ідеї приходять власнику в особисті.
# IDEAS_CHAT_ID = "-100..."
